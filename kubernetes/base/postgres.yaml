apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: catdog-platform
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS votes (
        id SERIAL PRIMARY KEY,
        option VARCHAR(10) NOT NULL UNIQUE,
        count BIGINT NOT NULL DEFAULT 0 CHECK (count >= 0),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_votes_option ON votes(option);
    INSERT INTO votes (option, count, updated_at)
    VALUES ('CAT', 0, CURRENT_TIMESTAMP), ('DOG', 0, CURRENT_TIMESTAMP)
    ON CONFLICT (option) DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: catdog-postgres
  namespace: catdog-platform
  labels:
    app: catdog-postgres
spec:
  ports:
    - port: 5432
      name: postgresql
      targetPort: 5432
  clusterIP: None
  selector:
    app: catdog-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catdog-postgres
  namespace: catdog-platform
  labels:
    app: catdog-postgres
spec:
  serviceName: "catdog-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: catdog-postgres
  template:
    metadata:
      labels:
        app: catdog-postgres
    spec:
      serviceAccountName: catdog-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: catdog-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: catdog-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catdog-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["psql", "-U", "postgres", "-d", "catdog", "-c", "SELECT 1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["psql", "-U", "postgres", "-d", "catdog", "-c", "SELECT 1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
