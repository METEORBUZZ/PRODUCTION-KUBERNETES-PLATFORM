apiVersion: v1
kind: Service
metadata:
  name: catdog-backend
  namespace: catdog-platform
  labels:
    app: catdog-backend
    app.kubernetes.io/name: catdog-backend
    app.kubernetes.io/part-of: catdog-voting
spec:
  type: ClusterIP
  selector:
    app: catdog-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
