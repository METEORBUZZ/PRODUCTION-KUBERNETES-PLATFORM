name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test Backend
        run: |
          cd backend
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  docker-build-and-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t catdog-backend:${{ github.sha }} -f docker/Dockerfile.backend .

      - name: Build Frontend Image
        run: |
          docker build -t catdog-frontend:${{ github.sha }} -f docker/Dockerfile.frontend .

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'catdog-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'catdog-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  validate-infrastructure:
    name: Kubernetes & Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Kubernetes Manifests
        run: |
          kustomize build kubernetes/base > /dev/null
          kustomize build kubernetes/overlays/production > /dev/null
          echo "Kubernetes manifests validated successfully."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate
