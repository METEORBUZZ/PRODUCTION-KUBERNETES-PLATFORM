name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-production:
    name: Build, Push to ECR & Deploy to EKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks-deployer
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg GIT_SHA=$IMAGE_TAG \
            -t $ECR_REGISTRY/catdog-backend:$IMAGE_TAG \
            -f docker/Dockerfile.backend .
          docker push $ECR_REGISTRY/catdog-backend:$IMAGE_TAG

      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/catdog-frontend:$IMAGE_TAG \
            -f docker/Dockerfile.frontend .
          docker push $ECR_REGISTRY/catdog-frontend:$IMAGE_TAG

      - name: Configure Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name catdog-platform-cluster

      - name: Deploy to EKS with Kustomize
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd kubernetes/overlays/production
          kustomize edit set image catdog-backend=$ECR_REGISTRY/catdog-backend:$IMAGE_TAG
          kustomize edit set image catdog-frontend=$ECR_REGISTRY/catdog-frontend:$IMAGE_TAG
          kubectl apply -k .

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/catdog-backend -n catdog-platform --timeout=180s
          kubectl rollout status deployment/catdog-frontend -n catdog-platform --timeout=180s

      - name: Post-Deployment Smoke Test
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh
