global:
  environment: production
  namespace: catdog-platform

replicaCount:
  backend: 3
  frontend: 3

image:
  backend:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/catdog-platform-backend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/catdog-platform-frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: catdog-sa
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  backend:
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  frontend:
    runAsUser: 101
    runAsGroup: 101
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

resources:
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health
  host: "voting.production.internal"
  tls:
    enabled: true
    certificateArn: "arn:aws:acm:us-east-1:123456789012:certificate/abc-123"

database:
  host: "catdog-platform-postgres.c123.us-east-1.rds.amazonaws.com"
  port: 5432
  name: "catdog"
  existingSecret: "catdog-db-secret"
