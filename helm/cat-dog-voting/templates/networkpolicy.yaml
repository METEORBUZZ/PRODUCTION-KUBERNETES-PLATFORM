{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cat-dog-voting.fullname" . }}-default-deny
  labels:
    {{- include "cat-dog-voting.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cat-dog-voting.fullname" . }}-allow-dns
  labels:
    {{- include "cat-dog-voting.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cat-dog-voting.fullname" . }}-backend-policy
  labels:
    {{- include "cat-dog-voting.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: catdog-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catdog-frontend
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["aws-load-balancer-controller", "ingress-nginx"]
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Egress to AWS RDS PostgreSQL
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cat-dog-voting.fullname" . }}-frontend-policy
  labels:
    {{- include "cat-dog-voting.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: catdog-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: catdog-backend
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
