{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cat-dog-voting.fullname" . }}
  labels:
    {{- include "cat-dog-voting.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.tls.enabled }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.tls.certificateArn | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "cat-dog-voting.fullname" . }}-backend
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "cat-dog-voting.fullname" . }}-backend
                port:
                  number: 8080
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: {{ include "cat-dog-voting.fullname" . }}-backend
                port:
                  number: 8080
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "cat-dog-voting.fullname" . }}-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cat-dog-voting.fullname" . }}-frontend
                port:
                  number: 8080
{{- end }}
