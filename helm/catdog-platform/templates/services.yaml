apiVersion: v1
kind: Service
metadata:
  name: {{ include "catdog-platform.fullname" . }}-backend
  labels:
    {{- include "catdog-platform.labels" . | nindent 4 }}
    app: catdog-backend
spec:
  type: ClusterIP
  selector:
    app: catdog-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "catdog-platform.fullname" . }}-frontend
  labels:
    {{- include "catdog-platform.labels" . | nindent 4 }}
    app: catdog-frontend
spec:
  type: ClusterIP
  selector:
    app: catdog-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
