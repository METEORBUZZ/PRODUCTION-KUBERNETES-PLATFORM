apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow HostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-host-path
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - catdog-platform
      validate:
        message: "HostPath volume mounts are forbidden in production."
        pattern:
          spec:
            =(volumes):
              - =(hostPath): null
